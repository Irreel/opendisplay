name: OpenSidecar
options:
  createIntermediateGroups: true
# Swift Package Manager dependencies. Sparkle powers the macOS app's
# out-of-store auto-update (issue #52); it's an embedded open-source
# framework + CLI tooling, not a hosted service — the appcast feed and the
# DMG are served from infrastructure we already own (GitHub Pages + Releases).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.x is the current major (latest 2.9.x) and the first Sparkle line to
    # support SPM. `from:` allows compatible 2.x updates.
    from: "2.6.0"
schemes:
  OpenSidecarMac:
    build:
      targets:
        OpenSidecarMac: all
    test:
      targets:
        - OpenSidecarMacTests
  OpenSidecariOS:
    build:
      targets:
        OpenSidecariOS: all
  OpenSidecarMacReceiver:
    build:
      targets:
        OpenSidecarMacReceiver: all
  DesignCanvas:
    build:
      targets:
        DesignCanvasTests: [test]
    test:
      targets:
        - DesignCanvasTests
  DesignCanvasMac:
    build:
      targets:
        DesignCanvasMac: all
    test:
      targets:
        - DesignCanvasTests
  DesignCanvasiOS:
    build:
      targets:
        DesignCanvasiOS: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps TestFlight builds unique).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSidecarMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared
    dependencies:
      - package: Sparkle
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: OpenDisplay connects to your iPad or iPhone over the local network in WiFi mode.
        NSBonjourServices: ["_opensidecar._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # --- Sparkle auto-update (issue #52) ---
        # The appcast feed is hosted on the landing-page site at the custom
        # domain. The release workflow publishes appcast.xml so this URL
        # resolves — see .github/workflows/release.yml.
        SUFeedURL: https://opendisplay.app/appcast.xml
        # Public EdDSA key from Sparkle's `generate_keys`. The matching private
        # key lives only as the `SPARKLE_PRIVATE_KEY` GitHub Actions secret
        # (used to sign the appcast in CI) and is never committed. Sparkle
        # verifies update signatures against this public key before installing.
        SUPublicEDKey: rYxlIePmwzi2bRo/qIsuY2TqTnQ34li2gQhJpGBiumw=
        # Check for updates automatically in the background on a schedule.
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac
        PRODUCT_NAME: OpenDisplay
        BUNDLE_DISPLAY_NAME: OpenDisplay
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "OpenDisplay".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.debug
          PRODUCT_NAME: OpenDisplay Dev
          BUNDLE_DISPLAY_NAME: OpenDisplay Dev
          # Colour-inverted icon so the dev build is obvious in the Dock,
          # cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under Shared/ and the files listed from Mac/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  OpenSidecarMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - MacReceiver
      - Shared
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CheckForUpdatesView.swift
    dependencies:
      - package: Sparkle
    info:
      path: MacReceiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: OpenDisplay Receiver advertises itself on the local network so another Mac can connect and use this Mac as a display.
        NSBonjourServices: ["_opensidecar._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # Own Sparkle feed (separate DMG, same signing key); published by
        # release.yml next to the sender's appcast.
        SUFeedURL: https://opendisplay.app/appcast-receiver.xml
        SUPublicEDKey: rYxlIePmwzi2bRo/qIsuY2TqTnQ34li2gQhJpGBiumw=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.receiver
        PRODUCT_NAME: OpenDisplay Receiver
        BUNDLE_DISPLAY_NAME: OpenDisplay Receiver
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacReceiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.receiver.debug
          PRODUCT_NAME: OpenDisplay Receiver Dev
          BUNDLE_DISPLAY_NAME: OpenDisplay Receiver Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  OpenSidecarMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTests
      - Mac/ControlFramePolicy.swift
      - Mac/SenderCanvasHooks.swift
      - Mac/SenderDiscoveryConfig.swift
      - Mac/DisplayArrangement.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Shared/LogSnapshot.swift
    settings:
      base:
        # A hostless test bundle: the sources under test are compiled straight
        # into it, so there is no app to inject into and nothing to load from.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # Without this the bundle has no Info.plist and code signing refuses to
        # run, which fails the build before a single test executes.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
  OpenSidecariOS:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: OpenDisplay
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: OpenDisplay advertises itself on the local network so your Mac can connect over WiFi.
        NSBonjourServices: ["_opensidecar._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The Design Canvas menu-bar app. Its own product, bundle id and Bonjour type, built from
  # OpenDisplay's sender: everything under Mac/ that the sender needs, and deliberately NOT
  # InputInjector.swift (a canvas session forwards no input and the app never asks for
  # Accessibility), OpenSidecarMacApp.swift, CheckForUpdatesView.swift or Sparkle.
  DesignCanvasMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Shared
      - DesignCanvas/Shared
      - DesignCanvas/Mac
      - Mac/MacSender.swift
      - Mac/SenderController.swift
      - Mac/SenderCanvasHooks.swift
      - Mac/SenderDiscoveryConfig.swift
      - Mac/ControlFramePolicy.swift
      - Mac/Usbmux.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/DisplayArrangement.swift
      - Mac/VirtualDisplay.swift
      - Mac/TestPatternWindow.swift
      - Mac/CGVirtualDisplayPrivate.h
    info:
      path: DesignCanvas/Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: Design Canvas connects to your iPad over the local network in WiFi mode.
        NSBonjourServices: ["_designcanvas._tcp"]
        NSAppleEventsUsageDescription: Design Canvas launches Claude Code by sending a command to Terminal.
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designcanvas.mac
        PRODUCT_NAME: Design Canvas
        BUNDLE_DISPLAY_NAME: Design Canvas
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: DesignCanvas/Mac/DesignCanvasMac.entitlements
      configs:
        # Same Debug-id separation OpenDisplay uses: TCC keys Screen Recording on bundle id +
        # signature, so a Debug build sharing the release id would knock out the release app's
        # grant on every rebuild. PRODUCT_NAME is what the permission list shows.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.designcanvas.mac.debug
          PRODUCT_NAME: Design Canvas Dev
          BUNDLE_DISPLAY_NAME: Design Canvas Dev
  # The Design Canvas iPad app. OpenDisplay's receiver core with Draw Mode on
  # top, listening on its own port and Bonjour type so the two products never
  # dial each other (plan ruling 1). iPad only: this is a drawing surface held
  # in two hands, not a phone screen. It takes three files from iOS/ — the
  # logger, the receiver's view model and the log viewer — and none of
  # OpenDisplay's own UI.
  DesignCanvasiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - Shared
      - DesignCanvas/Shared
      - DesignCanvas/iOS
      - iOS/Log.swift
      - iOS/ReceiverModel.swift
      - iOS/DiagnosticsLogView.swift
    info:
      path: DesignCanvas/iOS/Info.plist
      properties:
        CFBundleDisplayName: Design Canvas
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Design Canvas advertises itself on the local network so your Mac can connect over WiFi.
        NSBonjourServices: ["_designcanvas._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designcanvas.ipad
        PRODUCT_NAME: Design Canvas
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_ENTITLEMENTS: DesignCanvas/iOS/DesignCanvasiOS.entitlements
      configs:
        # Its own identity for local builds, like every other target here, so a
        # Debug install never replaces a release one on the same iPad.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.designcanvas.ipad.debug
  DesignCanvasTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - DesignCanvas/Tests
      - DesignCanvas/Shared
      # The iPad app's pure logic (Foundation + Combine + CoreGraphics only),
      # so the zoom maths and the Draw Mode view-model are unit-tested here
      # rather than through a running app (Task 12).
      - DesignCanvas/iOS/Logic
      - DesignCanvas/Mac/Engine
      # The menu-bar shell's logic, minus the three files that can only exist
      # inside the app: the @main scene, the SwiftUI menu, and the real engine
      # (which names SenderController/MacSender — not compiled here).
      - path: DesignCanvas/Mac/App
        excludes:
          - DesignCanvasMacApp.swift
          - OpenDisplaySenderEngine.swift
          - MenuBarView.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      # CanvasSession conforms to SenderCanvasDelegate and talks back through
      # CanvasOutbound, both declared here (Task 3).
      - Mac/SenderCanvasHooks.swift
      # The receiver-side canvas state StreamReceiver owns (Task 11). Pure and
      # Foundation-only, so it is unit-tested here rather than through a socket.
      - Shared/CanvasReceiverState.swift
      # The receiver itself, so the canvas seams can be exercised over a real
      # loopback socket. Protocol.swift and AppStore.swift are the only two
      # things it names beyond Foundation and Mac/Log.swift.
      - Shared/StreamReceiver.swift
      - Shared/Protocol.swift
      - Shared/AppStore.swift
    settings:
      base:
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.designcanvas.tests
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
