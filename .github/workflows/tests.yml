name: Tests

# Nothing checked pull requests before this, so a branch that did not compile
# (or a test target that could not build) only surfaced on someone's laptop.
on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells us nothing, so drop in-flight runs for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      # Deliberately without DEVELOPMENT_TEAM: nothing built here is
      # distributed, so an unsigned build is enough, and needing no secrets
      # means this check also runs on pull requests from forks.
      - name: Generate project
        run: xcodegen generate

      # Builds the Mac app as well as the test bundle, since the scheme covers
      # both — so this is a compile check for the app on top of the tests.
      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # The receiver app has a much lower deployment target than the sender
      # (issue #241); building it is what catches an API that only exists on
      # newer macOS sneaking into Shared/ or the receiver.
      - name: Build macOS receiver app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMacReceiver \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # The DesignCanvasMac scheme's test action also builds the DesignCanvasMac
      # app target (like OpenSidecarMac above), so this is both the Design
      # Canvas Swift test suite and a compile check for the Mac app.
      - name: Run Design Canvas Swift tests
        run: |
          xcodebuild test \
            -project OpenSidecar.xcodeproj \
            -scheme DesignCanvasMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # No iOS simulator/device run here (no signing, no hardware) — this is a
      # compile check only, same as OpenSidecariOS would be if it were built here.
      - name: Build Design Canvas iOS app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme DesignCanvasiOS \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: DesignCanvas/server/pnpm-lock.yaml

      # --frozen-lockfile: a lockfile drift should fail CI, not silently update.
      - name: Install dependencies
        run: pnpm --dir DesignCanvas/server install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir DesignCanvas/server typecheck

      - name: Unit tests
        run: pnpm --dir DesignCanvas/server test

      - name: Channel harness (two-process MCP topology)
        run: pnpm --dir DesignCanvas/server test:channel

      - name: End-to-end round script (no devices)
        run: pnpm --dir DesignCanvas/server test:e2e
