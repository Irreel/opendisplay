<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1B1F26; --muted:#5D6572; --rule:#DCE0E6; --rule-soft:#EBEEF2;
  --accent:#D3462A; --accent-ink:#B23A22; --accent-soft:#FBE9E4;
  --ok:#2E7D5B; --ok-soft:#E3F2EA; --warn:#9A6B00; --warn-soft:#FBF1D6; --info:#2F5FA8; --info-soft:#E4ECF9;
  --code-bg:#EEF1F5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181D; --surface:#1C2027; --ink:#E7EAEF; --muted:#9BA4B0; --rule:#2C323B; --rule-soft:#232830;
    --accent:#F0674C; --accent-ink:#F58A74; --accent-soft:#3A221D;
    --ok:#6FCFA2; --ok-soft:#1D3328; --warn:#E5B85C; --warn-soft:#3A2F14; --info:#8FB4F0; --info-soft:#1E2A3D;
    --code-bg:#242A33;
  }
}
:root[data-theme="dark"]{
  --bg:#15181D; --surface:#1C2027; --ink:#E7EAEF; --muted:#9BA4B0; --rule:#2C323B; --rule-soft:#232830;
  --accent:#F0674C; --accent-ink:#F58A74; --accent-soft:#3A221D;
  --ok:#6FCFA2; --ok-soft:#1D3328; --warn:#E5B85C; --warn-soft:#3A2F14; --info:#8FB4F0; --info-soft:#1E2A3D;
  --code-bg:#242A33;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;margin:0}
a{color:var(--accent-ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto;padding:40px 24px 96px;gap:48px}
@media (min-width:980px){.wrap{grid-template-columns:200px minmax(0,1fr)}}
nav.toc{display:none}
@media (min-width:980px){
  nav.toc{display:block;position:sticky;top:32px;align-self:start;font-size:13px;line-height:1.45}
  nav.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  nav.toc a{color:var(--muted);text-decoration:none;display:flex;gap:8px}
  nav.toc a:hover{color:var(--ink)}
  nav.toc .n{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);min-width:1.6em}
  nav.toc .eyebrow{margin-bottom:12px}
}
main{max-width:72ch}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.doc{border-bottom:1px solid var(--rule);padding-bottom:28px;margin-bottom:40px}
h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em;margin:10px 0 18px;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:14px;color:var(--muted)}
.meta dt{font-weight:600;color:var(--ink)}
.meta dd{margin:0}
.meta a{overflow-wrap:anywhere}
h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.01em;margin:56px 0 14px;display:flex;gap:12px;align-items:baseline;text-wrap:balance}
h2 .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;font-weight:500;color:var(--accent)}
h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;font-size:18px;margin:28px 0 8px;text-wrap:balance}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-left:1.3em}
li{margin:0 0 6px}
li::marker{color:var(--muted)}
strong{font-weight:600}
.lede{font-size:19px;line-height:1.5;color:var(--ink)}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;margin:18px 0;border-radius:0 6px 6px 0}
.callout.info{background:var(--info-soft);border-left-color:var(--info)}
.callout p:last-child{margin:0}
.table-wrap{overflow-x:auto;margin:14px 0 20px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--rule-soft)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.id,code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
td.id{color:var(--accent-ink);white-space:nowrap;font-weight:500}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;overflow-x:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13.5px;line-height:1.5;margin:14px 0 20px}
pre code{background:none;padding:0;font-size:inherit}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-right:6px}
.tag.reuse{background:var(--ok-soft);color:var(--ok)}
.tag.new{background:var(--accent-soft);color:var(--accent-ink)}
.tag.opt{background:var(--warn-soft);color:var(--warn)}
.tag.prior{background:var(--info-soft);color:var(--info)}
.gaps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.gaps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--rule);margin:0}
.gaps .gid{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;font-weight:500;color:var(--accent);padding-top:3px}
.gaps b{display:block;font-weight:600;margin-bottom:3px}
.gaps b .tag{vertical-align:middle;margin-left:6px;margin-right:0}
.gaps p{margin:0;color:var(--ink)}
.flow{list-style:none;counter-reset:step;padding:0;margin:0 0 20px;display:flex;flex-direction:column;gap:10px}
.flow li{counter-increment:step;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;margin:0}
.flow li::before{content:counter(step);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--bg);background:var(--ink);border-radius:999px;width:26px;height:26px;display:inline-grid;place-items:center;margin-top:2px}
.flow.cont{counter-reset:step 3}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:14px 0 20px}
.split > div{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.split h3{margin-top:0}
.split ul{margin-bottom:0}
.changelog{font-size:14px;color:var(--muted);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;margin-top:18px}
.changelog b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<style>.box{display:inline-block;width:.8em;height:.8em;border:1.5px solid var(--muted);border-radius:3px;margin-right:8px;vertical-align:-1px}li ul{margin:6px 0 4px;font-size:14.5px;color:var(--muted)}li ul code{color:var(--ink)}@media (max-width:480px){.wrap{padding-inline:16px}h1{font-size:34px}}</style>
